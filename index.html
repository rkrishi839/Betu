<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorry Betu ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
overflow:hidden;
}

.card{
width:90%;
max-width:400px;
padding:25px;
text-align:center;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
border-radius:25px;
color:white;
}

.photo{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:5px solid white;
}

h1{
margin-top:15px;
font-size:30px;
}

p{
margin-top:15px;
line-height:1.7;
}

button{
margin-top:15px;
padding:12px 25px;
border:none;
border-radius:30px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.heart{
position:absolute;
bottom:-20px;
animation:float 6s linear forwards;
}

@keyframes float{
100%{
transform:translateY(-110vh);
opacity:0;
}
}
</style>
</head>

<body>

<audio id="music" loop>
<source src="maan meri jaan.mp3" type="audio/mpeg">
</audio>

<div class="card">

<img src="Photo1.jpg" class="photo">

<h1>🥺 Betu ❤️</h1>

<p>
Please apne Betu ko maaf kar do na... 🥺💔<br><br>

Mujhse galti ho gayi... 😔<br>
Aur mujhe uska bahut afsos hai ❤️<br><br>

Tum meri duniya ho 🌍💕<br>
Tumhare bina sab adhura lagta hai 💖
</p>

<button onclick="document.getElementById('music').play()">
🎵 Play Song
</button>

<br>

<a href="memories.html">
<button>
📸 Our Memories ❤️
</button>
</a>

</div>

<script>
function createHeart(){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*25)+"px";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);
}

setInterval(createHeart,300);
</script>

</body>
</html>
