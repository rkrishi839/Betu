<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Memories ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
overflow:hidden;
}

.box{
width:90%;
max-width:450px;
padding:20px;
text-align:center;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
border-radius:25px;
color:white;
}

.slide{
display:none;
width:100%;
height:450px;
object-fit:cover;
border-radius:20px;
}

.active{
display:block;
}

.caption{
margin-top:15px;
font-size:18px;
font-weight:bold;
}

button{
margin-top:15px;
padding:12px 20px;
border:none;
border-radius:25px;
cursor:pointer;
font-weight:bold;
}

.heart{
position:absolute;
bottom:-20px;
animation:float 6s linear forwards;
}

@keyframes float{
100%{
transform:translateY(-110vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="box">

<h2>❤️ Our Beautiful Memories ❤️</h2>

<img src="Pphoto1.jpg" class="slide active">
<img src="photo2.jpg" class="slide">
<img src="photo3.jpg" class="slide">
<img src="photo4.jpg" class="slide">

<div class="caption" id="caption">
🥰 Hamari Sabse Pyari Memory
</div>

<button onclick="prevSlide()">⬅️</button>
<button onclick="nextSlide()">➡️</button>

<br>

<a href="index.html">
<button>❤️ Betu Wapas Chalo ❤️</button>
</a>

</div>

<script>

const captions=[
"🥰 Hamari Sabse Pyari Memory",
"💕 Tumhari Smile Meri Favourite Hai",
"🌹 Best Moment Together",
"❤️ I Love You Forever Betu"
];

let slides=document.querySelectorAll(".slide");
let caption=document.getElementById("caption");
let index=0;

function showSlide(n){
slides.forEach(slide=>slide.classList.remove("active"));
slides[n].classList.add("active");
caption.innerHTML=captions[n];
}

function nextSlide(){
index=(index+1)%slides.length;
showSlide(index);
}

function prevSlide(){
index=(index-1+slides.length)%slides.length;
showSlide(index);
}

setInterval(nextSlide,3000);

function createHeart(){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*25)+"px";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);
}

setInterval(createHeart,300);

</script>

</body>
</html>
