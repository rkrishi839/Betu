<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Betu ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ff9a9e,#fad0c4);
background-size:400% 400%;
animation:bg 10s ease infinite;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:90%;
max-width:400px;
padding:30px;
text-align:center;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
border-radius:25px;
color:white;
box-shadow:0 0 25px rgba(0,0,0,.2);
z-index:2;
}

.photo{
width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
border:5px solid white;
box-shadow:0 0 20px rgba(255,255,255,.8);
}

h1{
margin-top:15px;
font-size:30px;
}

p{
margin-top:15px;
line-height:1.7;
font-size:17px;
}

button{
margin-top:15px;
padding:12px 25px;
border:none;
border-radius:30px;
cursor:pointer;
font-size:16px;
font-weight:bold;
background:white;
color:#ff4d88;
}

#special{
display:none;
margin-top:20px;
font-size:18px;
animation:fade 1s;
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

.heart{
position:absolute;
bottom:-20px;
font-size:25px;
animation:float linear forwards;
}

@keyframes float{
0%{transform:translateY(0);opacity:1;}
100%{transform:translateY(-110vh);opacity:0;}
}
</style>
</head>
<body>

<!-- Music -->
<audio id="music" loop>
<source src="song.mp3" type="audio/mpeg">
</audio>

<div class="card">

<!-- Apni photo ka URL lagao -->
<img src="photos/betu.jpg" class="photo">

<h1>🥺 Betu, Please Maaf Kar Do ❤️</h1>

<p>
Betu... 🥹💖<br><br>

Mujhse galti ho gayi hai... 💔<br>
Aur mujhe glti ka afsos h betu 🙏❤️<br><br>

Please apne Betu ko maaf kar do na... 🥺💕<br>
Tumhari smile meri duniya hai 🌍❤️<br>
Tumhare bina sab kuch adhura lagta hai... 💞✨
</p>

<button onclick="playMusic()">🎵 Play Song</button>

<button onclick="showMsg()">💖 Maaf Kiya?</button>

<div id="special">
🌹 Thank You Betu 🌹<br>
I Lobbbbbb youuuuu So Much Betu ❤️🥰✨
</div>

</div>

<script>

function playMusic(){
document.getElementById("music").play();
}

function showMsg(){
document.getElementById("special").style.display="block";
}

function createHeart(){
const heart=document.createElement("div");
heart.classList.add("heart");

const emojis=["❤️","💕","💖","💘","🥰","😘","🌹"];
heart.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*20)+"px";
heart.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);
}

setInterval(createHeart,250);

</script>

</body>
</html>
